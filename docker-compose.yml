services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=voipuser
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}

  app:
    build: .
    restart: unless-stopped
    # only reachable through caddy, never published on the host
    expose:
      - "8080"
    env_file: .env
    environment:
      - DB=mongodb://voipuser:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/voip?authSource=admin
      - PORT=8080
      - BASE_URL=https://${DOMAIN:?set DOMAIN in .env}/
      - HTTPS=true
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  mongo_data:
  uploads:
  caddy_data:
  caddy_config:
